name: poky-build

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ubuntu:
        description: 'Ubuntu version'
        default: '22.04'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build core-image-minimal
        run: |
          UV="${{ inputs.ubuntu || '22.04' }}"
          mkdir -p work dl sstate
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/work:/workdir" \
            -v "$PWD/dl:/downloads" \
            -v "$PWD/sstate:/sstate" \
            -w /workdir \
            ghcr.io/${{ github.repository }}:ubuntu-$UV -c '
              set -euo pipefail
              git clone -b scarthgap --depth 1 git://git.yoctoproject.org/poky
              cd poky
              source oe-init-build-env build
              echo "DL_DIR = \"/downloads\"" >> conf/local.conf
              echo "SSTATE_DIR = \"/sstate\"" >> conf/local.conf
              bitbake core-image-minimal
            '